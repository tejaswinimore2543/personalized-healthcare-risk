<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personalized Healthcare</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #66a6ff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #66a6ff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4b90e2;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Health Prediction Form</h2>

    <form action="/predict" method="post">
        <label>Recency</label>
        <input type="number" name="Recency" required>

        <label>Frequency</label>
        <input type="number" name="Frequency" required>

        <label>Monetary</label>
        <input type="number" name="Monetary" required>

        <label>Time</label>
        <input type="number" name="Time" required>

        <button type="submit">Predict</button>
    </form>

    <div class="footer">
        Personalized Healthcare Prediction
    </div>
</div>

</body>
</html>
